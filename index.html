<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rahoentusy WMS</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --panel-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-blue: #38bdf8;
      --accent-green: #4ade80;
      --accent-red: #f87171;
      --accent-orange: #fb923c;
      --border-color: #334155;
    }
    
    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* Header & Navigation */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
      background-color: var(--panel-bg);
      border-bottom: 1px solid var(--border-color);
    }
    .logo {
      font-size: 1.2rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .user-info {
      font-size: 0.9rem;
      color: var(--accent-blue);
    }

    .tab-bar {
      display: flex;
      gap: 5px;
      padding: 10px 20px;
      background-color: var(--bg-color);
      overflow-x: auto;
      border-bottom: 1px solid var(--border-color);
    }
    .tab-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      padding: 8px 16px;
      cursor: pointer;
      font-size: 0.95rem;
      border-bottom: 2px solid transparent;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .tab-btn:hover {
      color: var(--text-main);
    }
    .tab-btn.active {
      color: var(--accent-blue);
      border-bottom-color: var(--accent-blue);
    }

    /* Summary Box */
    .summary-box-compact {
      display: flex;
      gap: 15px;
      padding: 10px 20px;
      background-color: var(--panel-bg);
      border-bottom: 1px solid var(--border-color);
      font-size: 0.9rem;
      font-weight: bold;
      color: var(--text-muted);
    }
    .summary-item-compact span {
      margin-left: 5px;
      color: var(--accent-blue);
    }
    .text-green { color: var(--accent-green) !important; }
    .text-red { color: var(--accent-red) !important; }

    /* Table Styles */
    .table-container {
      padding: 0;
      overflow-x: auto;
      height: calc(100vh - 130px);
    }
    .compact-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      line-height: 1.2;
      font-family: 'Roboto Mono', monospace;
    }
    .compact-table th {
      background-color: var(--panel-bg);
      color: var(--text-muted);
      font-weight: normal;
      padding: 8px;
      text-align: left;
      position: sticky;
      top: 0;
      border-bottom: 1px solid var(--border-color);
    }
    .compact-table td {
      padding: 6px 8px;
      border-bottom: 1px solid var(--border-color);
      white-space: nowrap;
    }
    .compact-table tbody tr:hover {
      background-color: rgba(255, 255, 255, 0.05);
    }

    /* Status Colors */
    .status-qcing { color: var(--text-main); }
    .status-complete { color: var(--accent-green); }
    
    /* Login Overlay */
    #loginOverlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: var(--bg-color);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .login-box {
      background-color: var(--panel-bg);
      padding: 30px;
      border-radius: 8px;
      text-align: center;
      border: 1px solid var(--border-color);
    }
    .login-box input {
      padding: 10px;
      margin-top: 15px;
      border-radius: 4px;
      border: 1px solid var(--border-color);
      background: var(--bg-color);
      color: var(--text-main);
    }
    .login-box button {
      padding: 10px 20px;
      margin-top: 15px;
      background-color: var(--accent-blue);
      color: #000;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    
    .loading-indicator {
      display: none;
      position: fixed;
      top: 10px;
      right: 20px;
      color: var(--accent-orange);
      font-size: 0.9rem;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { opacity: 0.5; }
      50% { opacity: 1; }
      100% { opacity: 0.5; }
    }
    
    .view-section { display: none; }
    .view-section.active { display: block; }
  </style>
</head>
<body>

  <!-- Login Screen -->
  <div id="loginOverlay">
    <div class="login-box">
      <h2>WMS Login</h2>
      <input type="password" id="pinInput" placeholder="Enter PIN">
      <br>
      <button onclick="login()">Login</button>
      <button onclick="activateGodMode()" style="background-color: var(--accent-orange);">Dev Admin</button>
      <div id="loginMsg" style="color: var(--accent-red); margin-top: 10px;"></div>
    </div>
  </div>

  <div class="header">
    <div class="logo">📦 Rahoentusy</div>
    <div class="user-info" id="userDisplay"></div>
  </div>
  
  <div id="loadingIndicator" class="loading-indicator">Loading...</div>

  <!-- Dynamic Tab Bar -->
  <div class="tab-bar" id="mainTabBar"></div>

  <!-- Summary Sections -->
  <div class="summary-box-compact" id="recSummaryBox" style="display: none;">
    <div class="summary-item-compact">ROWS:<span id="totRecRows">0</span></div>
    <div class="summary-item-compact">SCND:<span id="totRecScnd" class="text-green">0</span></div>
    <div class="summary-item-compact text-red">-SCN:<span id="totRecScn" class="text-red">0</span></div>
    <div class="summary-item-compact">UPD:<span id="totRecUpd" class="text-green">--</span></div>
  </div>

  <!-- Table Container -->
  <div class="table-container">
    <table class="compact-table" id="dataTable">
      <thead id="tableHead"></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <script>
    const CONFIG = {
      tabMapping: {
        "rec": { label: "REC", action: "getRecData" },
        "gao": { label: "DI", action: "getGaoData" },
        "lp": { label: "LP", action: "getLoadplanData" },
        "uph": { label: "UPH", action: "getUphData" },
        "list": { label: "補貨", action: "getAlQtyList" },
        "map": { label: "MAP", action: "getMapData" },
        "orderStatus": { label: "訂單", action: "getOrderStatusData" },
        "search": { label: "查詢", action: "searchLocation" },
        "audit": { label: "盤點", action: "searchLocation" },
        "db": { label: "DB", action: "getDbData" }
      }
    };

    let currentUser = null;
    let userPermissions = [];
    let currentTab = null;

    function login() {
      const pin = document.getElementById('pinInput').value;
      if (!pin) return;
      document.getElementById('loginMsg').textContent = "Authenticating...";
      
      google.script.run
        .withSuccessHandler(function(res) {
          if (res.success) {
            handleLoginSuccess(res);
          } else {
            document.getElementById('loginMsg').textContent = res.error || "Login failed";
          }
        })
        .withFailureHandler(function(err) {
          document.getElementById('loginMsg').textContent = err.message;
        })
        .handleApiGet({ action: 'verifyPinCode', pin: pin });
    }

    function activateGodMode() {
      // Mock authorization for development
      const mockAuth = {
        success: true,
        name: "Dev Admin",
        permissions: ["rec", "gao", "lp", "uph", "list", "map", "orderStatus", "search", "audit", "db"]
      };
      handleLoginSuccess(mockAuth);
    }

    function handleLoginSuccess(res) {
      currentUser = res.name;
      userPermissions = res.permissions || [];
      document.getElementById('userDisplay').textContent = "Logged as: " + currentUser;
      document.getElementById('loginOverlay').style.display = 'none';
      
      buildDynamicTabs();
      
      if (userPermissions.length > 0) {
        switchTab(userPermissions[0]);
      }
    }

    function buildDynamicTabs() {
      const tabBar = document.getElementById('mainTabBar');
      tabBar.innerHTML = ''; 

      userPermissions.forEach(perm => {
        const config = CONFIG.tabMapping[perm];
        if (config) {
          const btn = document.createElement('button');
          btn.className = 'tab-btn';
          btn.dataset.target = perm;
          btn.textContent = config.label;
          btn.onclick = () => switchTab(perm);
          tabBar.appendChild(btn);
        }
      });
    }

    function switchTab(tabId) {
      currentTab = tabId;
      document.querySelectorAll('.tab-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.target === tabId);
      });

      document.getElementById('recSummaryBox').style.display = (tabId === 'rec') ? 'flex' : 'none';
      
      document.getElementById('tableHead').innerHTML = '';
      document.getElementById('tableBody').innerHTML = '';

      fetchDataForTab(tabId);
    }

    function fetchDataForTab(tabId) {
      const config = CONFIG.tabMapping[tabId];
      if (!config || !config.action) return;

      document.getElementById('loadingIndicator').style.display = 'block';
      const cacheKey = 'wms_data_' + tabId;
      let cached = sessionStorage.getItem(cacheKey);

      if (cached) {
        try {
          let parsedData = JSON.parse(cached);
          
          // Check for missing updValue in REC tab to force cache invalidation
          if (tabId === 'rec' && typeof parsedData.updValue === 'undefined') {
            console.log("Stale cache detected for REC. Invalidating cache.");
            sessionStorage.removeItem(cacheKey);
          } else {
            renderData(tabId, parsedData);
            document.getElementById('loadingIndicator').style.display = 'none';
            return; // Cache valid, exit early
          }
        } catch (e) {
          console.error("Cache parsing error", e);
          sessionStorage.removeItem(cacheKey);
        }
      }

      // Fetch fresh data from backend
      google.script.run
        .withSuccessHandler(function(res) {
          if (!res.error) {
            sessionStorage.setItem(cacheKey, JSON.stringify(res));
            renderData(tabId, res);
          }
          document.getElementById('loadingIndicator').style.display = 'none';
        })
        .withFailureHandler(function(err) {
          console.error(err);
          document.getElementById('loadingIndicator').style.display = 'none';
        })
        .handleApiGet({ action: config.action });
    }

    function renderData(tabId, res) {
      if (tabId === 'rec') renderRecData(res);
      else if (tabId === 'lp') renderLoadplanData(res);
      else renderGenericTable(res);
    }

    function renderRecData(res) {
      document.getElementById('totRecRows').textContent = res.rowCount || 0;
      document.getElementById('totRecUpd').textContent = res.updValue || '--';

      let tScnd = 0, tScn = 0;
      let scndIdx = -1, scnIdx = -1;

      if (res.headers) {
        scndIdx = res.headers.findIndex(h => h.toUpperCase().trim() === 'SCND');
        scnIdx = res.headers.findIndex(h => h.toUpperCase().trim() === '-SCN');
        
        let theadHTML = '<tr>';
        res.headers.forEach(h => {
          theadHTML += `<th>${h}</th>`;
        });
        theadHTML += '</tr>';
        document.getElementById('tableHead').innerHTML = headHTML;
      }

      if (res.data) {
        let tbodyHTML = '';
        res.data.forEach(row => {
          let trClass = '';
          if (row['NOTE'] && row['NOTE'].toLowerCase().includes('complete')) trClass = 'status-complete';
          else if (row['NOTE'] && row['NOTE'].toLowerCase().includes('qcing')) trClass = 'status-qcing';

          tbodyHTML += `<tr class="${trClass}">`;
          res.headers.forEach((h, idx) => {
            let val = row[h] || '';
            let cellStyle = '';
            
            if (idx === scndIdx && parseFloat(val) > 0) tScnd += parseFloat(val);
            if (idx === scnIdx && parseFloat(val) < 0) tScn += parseFloat(val);

            // Conditional styling for specific columns
            if (h.toUpperCase() === 'S/O') cellStyle = 'color: var(--accent-orange); font-weight: bold;';
            if (h.toUpperCase() === 'SCND') cellStyle = 'color: var(--accent-green);';
            if (h.toUpperCase() === '-SCN') cellStyle = 'color: var(--accent-red);';

            tbodyHTML += `<td style="${cellStyle}">${val}</td>`;
          });
          tbodyHTML += '</tr>';
        });
        document.getElementById('tableBody').innerHTML = tbodyHTML;
      }

      document.getElementById('totRecScnd').textContent = tScnd;
      document.getElementById('totRecScn').textContent = tScn;
    }

    function renderLoadplanData(res) {
      if (!res.headers || !res.data) return;

      let theadHTML = '<tr>';
      res.headers.forEach(h => { theadHTML += `<th>${h}</th>`; });
      theadHTML += '</tr>';
      document.getElementById('tableHead').innerHTML = theadHTML;

      let tbodyHTML = '';
      res.data.forEach(row => {
        tbodyHTML += '<tr>';
        res.headers.forEach(h => {
          let val = row[h] || '';
          let cellStyle = '';
          
          if (h.toUpperCase() === 'IDETAILS' || h.toUpperCase() === 'ODETAILS') {
            cellStyle = 'font-size: 14px; white-space: normal; line-height: 1.4; min-width: 200px;';
            
            // Regex highlighting for LP
            val = val.replace(/(FTW|GOH|DI|DI\(FTW\)|TBC|Truck Loading)/gi, '<span style="color: var(--accent-orange); font-weight: bold;">$1</span>');
            val = val.replace(/(SI[ a-zA-Z0-9-]*)/g, '<span style="color: #fde047; font-weight: bold;">$1</span>');
            val = val.replace(/(SS\d+[A-Za-z-]*)/g, '<span style="color: var(--accent-red); font-weight: bold;">$1</span>');
            val = val.replace(/(ctns|pcs|cbm)/gi, '<span style="color: var(--accent-blue); font-weight: bold;">$1</span>');
          }
          
          tbodyHTML += `<td style="${cellStyle}">${val}</td>`;
        });
        tbodyHTML += '</tr>';
      });
      document.getElementById('tableBody').innerHTML = tbodyHTML;
    }

    function renderGenericTable(res) {
      if (!res.headers || !res.data) return;
      
      let theadHTML = '<tr>';
      res.headers.forEach(h => { theadHTML += `<th>${h}</th>`; });
      theadHTML += '</tr>';
      document.getElementById('tableHead').innerHTML = theadHTML;

      let tbodyHTML = '';
      res.data.forEach(row => {
        tbodyHTML += '<tr>';
        res.headers.forEach(h => {
          tbodyHTML += `<td>${row[h] || ''}</td>`;
        });
        tbodyHTML += '</tr>';
      });
      document.getElementById('tableBody').innerHTML = tbodyHTML;
    }
  </script>
</body>
</html>
